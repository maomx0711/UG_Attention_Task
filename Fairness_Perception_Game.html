<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公平观念互动测试</title>

    <script src="./jspsych/jspsych.js"></script>
    <link rel="stylesheet" href="./jspsych/jspsych.css">
    <script src="./jspsych/plugin-html-button-response.js"></script>
    <script src="./jspsych/plugin-html-keyboard-response.js"></script>
    <script src="./jspsych/plugin-survey-text.js"></script>
    <script src="./jspsych/plugin-survey-likert.js"></script>
    <script src="./jspsych/plugin-call-function.js"></script>

    <style>
        body {
            user-select: none;
            background-color: #f0f4f8;
            color: #2d3748;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            font-size: 16pt;
            line-height: 1.7;
            margin: 0;
            padding: 0;
        }

        .jspsych-content {
            max-width: 900px;
            margin: auto;
        }

        .jspsych-btn {
            font-size: 14pt;
            font-family: inherit;
            margin: 0.4em;
            padding: 12px 28px;
            border-radius: 8px;
            background-color: #4a6fa5;
            color: white;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 120px;
        }

        .jspsych-btn:hover {
            background-color: #3d5d8a;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(74, 111, 165, 0.3);
        }

        .game-container {
            background: white;
            border-radius: 12px;
            padding: 32px 40px;
            margin: 20px auto;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .game-title {
            font-size: 26pt;
            font-weight: bold;
            color: #2c5282;
            text-align: center;
            margin-bottom: 8px;
        }

        .game-subtitle {
            font-size: 13pt;
            color: #718096;
            text-align: center;
            margin-bottom: 24px;
        }

        .meta-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .meta-tag {
            font-size: 11pt;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 500;
        }

        .tag-distributive { background: #ebf8ff; color: #2b6cb0; }
        .tag-procedural { background: #faf5ff; color: #6b46c1; }
        .tag-interactional { background: #f0fff4; color: #276749; }
        .tag-victim { background: #fff5f5; color: #c53030; }
        .tag-beneficiary { background: #fffff0; color: #b7791f; }
        .tag-bystander { background: #f7fafc; color: #4a5568; }
        .tag-participant { background: #e6fffa; color: #285e61; }
        .tag-dominator { background: #fffaf0; color: #c05621; }

        .scenario-narrative {
            background: #f7fafc;
            border-left: 4px solid #4a6fa5;
            padding: 20px 24px;
            margin: 20px 0;
            border-radius: 0 8px 8px 0;
            font-size: 15pt;
            line-height: 1.8;
        }

        .scenario-question {
            font-size: 16pt;
            font-weight: 600;
            color: #2d3748;
            margin: 24px 0 16px;
            text-align: center;
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background: #e2e8f0;
            border-radius: 4px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #4a6fa5, #63b3ed);
            transition: width 0.4s ease;
        }

        .progress-text {
            text-align: center;
            font-size: 12pt;
            color: #a0aec0;
            margin-bottom: 8px;
        }

        .choice-btn {
            display: block;
            width: 100%;
            max-width: 600px;
            margin: 10px auto;
            text-align: left;
            padding: 16px 24px !important;
            font-size: 14pt !important;
            line-height: 1.5;
            white-space: normal;
        }

        .rating-prompt {
            text-align: center;
            font-size: 14pt;
            color: #4a5568;
            margin: 16px 0;
        }

        .summary-card {
            background: #f7fafc;
            border-radius: 8px;
            padding: 16px 20px;
            margin: 12px 0;
        }

        .summary-card h4 {
            margin: 0 0 8px;
            color: #2c5282;
        }

        .profile-bar {
            display: flex;
            align-items: center;
            margin: 8px 0;
        }

        .profile-label {
            width: 100px;
            font-size: 12pt;
            color: #4a5568;
        }

        .profile-track {
            flex: 1;
            height: 12px;
            background: #e2e8f0;
            border-radius: 6px;
            overflow: hidden;
        }

        .profile-fill {
            height: 100%;
            border-radius: 6px;
            transition: width 0.5s;
        }

        .fill-distributive { background: #4299e1; }
        .fill-procedural { background: #9f7aea; }
        .fill-interactional { background: #48bb78; }

        .instruction-list {
            text-align: left;
            max-width: 700px;
            margin: 0 auto;
        }

        .instruction-list li {
            margin: 10px 0;
        }

        #jspsych-survey-likert-form p {
            font-size: 14pt;
        }

        .jspsych-survey-likert-opt-label {
            font-size: 11pt;
        }
    </style>
</head>
<body></body>
<script>
// ============================================================
// 公平观念互动测试 — 场景引擎与自适应分支系统
// 三个维度：分配公平 / 程序公平 / 互动公平
// 三种视角：受害者 / 获利者 / 旁观者
// 两种角色：参与者 / 支配者
// ============================================================

const DIMENSION_LABELS = {
    distributive: '分配公平',
    procedural: '程序公平',
    interactional: '互动公平'
};

const PERSPECTIVE_LABELS = {
    victim: '受害者视角',
    beneficiary: '获利者视角',
    bystander: '旁观者视角'
};

const ROLE_LABELS = {
    participant: '参与者',
    dominator: '支配者'
};

const TOTAL_SCENARIOS = 8;

// ---------- 被试状态与公平画像 ----------
const gameState = {
    subjectID: '',
    scenarioIndex: 0,
    scenarioQueue: [],
    responses: [],
    profile: {
        distributive: 0,
        procedural: 0,
        interactional: 0,
        acceptUnfair: 0,
        rejectUnfair: 0,
        intervene: 0,
        voiceConcern: 0,
        prioritizeProcedure: 0,
        prioritizeOutcome: 0,
        prioritizeInteraction: 0
    }
};

// ---------- 场景库 ----------
const SCENARIO_POOL = {

    // ===== 分配公平 =====
    dist_victim_participant: {
        id: 'dist_victim_participant',
        dimension: 'distributive',
        perspective: 'victim',
        role: 'participant',
        narrative: '你和另一位同事共同完成了一项重要项目，经理宣布奖励分配方案：对方获得 8000 元，你获得 2000 元。经理说这是因为对方"贡献更大"，但你认为自己付出了同等努力。你是该项目的参与者之一。',
        question: '面对这种分配结果，你会怎么做？',
        choices: [
            { key: 'reject', text: '明确拒绝接受，要求重新评估分配方案', tags: { rejectUnfair: 2, distributive: 2 } },
            { key: 'negotiate', text: '与经理协商，提出更公平的分配比例', tags: { voiceConcern: 2, distributive: 1 } },
            { key: 'accept_reluctant', text: '勉强接受，但内心感到不公平', tags: { acceptUnfair: 1, distributive: 1 } },
            { key: 'accept', text: '接受结果，认为经理有权决定分配', tags: { acceptUnfair: 2, prioritizeOutcome: -1 } }
        ],
        ratings: ['分配公平程度', '程序公平程度', '互动公平程度']
    },

    dist_beneficiary_dominator: {
        id: 'dist_beneficiary_dominator',
        dimension: 'distributive',
        perspective: 'beneficiary',
        role: 'dominator',
        narrative: '作为团队负责人，你需要在两位组员之间分配 10000 元项目奖金。两人工作量相当，但其中一位与你私交更好。你可以自由决定分配比例。你是分配方案的支配者。',
        question: '你会如何分配这笔奖金？',
        choices: [
            { key: 'equal', text: '平均分配，各 5000 元', tags: { distributive: 2, prioritizeOutcome: 1 } },
            { key: 'merit', text: '按实际贡献分配（各 5000 元，但公开评估标准）', tags: { distributive: 1, procedural: 1 } },
            { key: 'favor', text: '给私交好的同事 7000 元，另一位 3000 元', tags: { acceptUnfair: -2, distributive: -2 } },
            { key: 'self', text: '自己留 4000 元，剩余按 6:4 分给两人', tags: { acceptUnfair: -3, distributive: -3 } }
        ],
        ratings: ['分配公平程度', '程序公平程度', '互动公平程度']
    },

    dist_bystander_participant: {
        id: 'dist_bystander_participant',
        dimension: 'distributive',
        perspective: 'bystander',
        role: 'participant',
        narrative: '在一次部门会议上，你作为与会者目睹了以下情景：经理将一笔 12000 元的奖金分配给了三位员工，比例为 6000:4000:2000。获得最少的那位员工看起来明显不满，但没有说话。你与此事无直接利益关系。',
        question: '作为旁观者，你会如何反应？',
        choices: [
            { key: 'speak_up', text: '当场提出质疑，建议重新审议分配方案', tags: { intervene: 2, distributive: 2, voiceConcern: 2 } },
            { key: 'private_talk', text: '会后私下安慰那位员工，并建议他申诉', tags: { voiceConcern: 1, distributive: 1 } },
            { key: 'stay_silent', text: '保持沉默，不介入他人的分配纠纷', tags: { acceptUnfair: 1 } },
            { key: 'support_manager', text: '认为经理有权决定，支持现有分配', tags: { acceptUnfair: 2, prioritizeOutcome: -1 } }
        ],
        ratings: ['分配公平程度', '程序公平程度', '互动公平程度']
    },

    // ===== 程序公平 =====
    proc_victim_participant: {
        id: 'proc_victim_participant',
        dimension: 'procedural',
        perspective: 'victim',
        role: 'participant',
        narrative: '公司正在评选年度优秀员工，获奖者可获得 15000 元奖金和晋升机会。评选委员会在没有征求你意见的情况下，直接宣布了获奖名单——你未入选。后来你得知，评选标准从未公开，评委中有获奖者的亲属。你是评选过程的参与者。',
        question: '你认为这个评选过程公平吗？你会怎么做？',
        choices: [
            { key: 'formal_appeal', text: '提出正式申诉，要求公开评选标准并重新评审', tags: { rejectUnfair: 2, procedural: 2, voiceConcern: 2 } },
            { key: 'accept_process', text: '接受结果，但向人力资源部门反映程序问题', tags: { procedural: 1, voiceConcern: 1 } },
            { key: 'resign', text: '对这个不公正的过程感到失望，考虑离职', tags: { rejectUnfair: 1, procedural: 1 } },
            { key: 'accept', text: '接受结果，认为评选结果比过程更重要', tags: { acceptUnfair: 1, prioritizeOutcome: 2 } }
        ],
        ratings: ['程序公平程度', '分配公平程度', '互动公平程度']
    },

    proc_beneficiary_dominator: {
        id: 'proc_beneficiary_dominator',
        dimension: 'procedural',
        perspective: 'beneficiary',
        role: 'dominator',
        narrative: '你是学校奖学金评审小组的组长，有权决定最终的获奖名单。按规则应该进行公开答辩和投票，但时间紧迫。你的一位学生与你关系很好，成绩中等；另一位学生成绩更好但性格内向。你可以决定走完整流程还是简化流程。你是评审过程的支配者。',
        question: '你会如何处理这次评审？',
        choices: [
            { key: 'full_process', text: '坚持完整公开流程，让所有人答辩并投票', tags: { procedural: 2, distributive: 1 } },
            { key: 'simplified', text: '简化流程但公开评审标准，由小组讨论决定', tags: { procedural: 1 } },
            { key: 'favor_friend', text: '直接推荐关系好的学生，省略答辩环节', tags: { procedural: -2, acceptUnfair: -2 } },
            { key: 'grade_only', text: '仅按成绩排名决定，不进行答辩', tags: { procedural: -1, prioritizeOutcome: 1 } }
        ],
        ratings: ['程序公平程度', '分配公平程度', '互动公平程度']
    },

    proc_bystander_participant: {
        id: 'proc_bystander_participant',
        dimension: 'procedural',
        perspective: 'bystander',
        role: 'participant',
        narrative: '你所在的社区业主委员会正在选举新主任。选举过程中，现任主任突然修改了投票规则，取消了匿名投票，改为举手表决。你观察到几位邻居在举手时显得犹豫不决，似乎受到了压力。你并非候选人，但参与了这次选举。',
        question: '你如何看待这个选举过程？',
        choices: [
            { key: 'protest', text: '当场反对，要求恢复匿名投票', tags: { intervene: 2, procedural: 2, voiceConcern: 2 } },
            { key: 'abstain', text: '拒绝参与举手表决，以表达不满', tags: { rejectUnfair: 1, procedural: 1 } },
            { key: 'comply', text: '虽然不满但配合完成选举', tags: { acceptUnfair: 1 } },
            { key: 'support', text: '认为举手表决更透明，支持新规则', tags: { acceptUnfair: 1, procedural: -1 } }
        ],
        ratings: ['程序公平程度', '分配公平程度', '互动公平程度']
    },

    // ===== 互动公平 =====
    inter_victim_participant: {
        id: 'inter_victim_participant',
        dimension: 'interactional',
        perspective: 'victim',
        role: 'participant',
        narrative: '在部门会议上，你提出了一个工作建议。经理当众打断你，说"这种小事不用你操心"，随后认真听取了另一位同事提出的类似建议并表示赞赏。会后同事们私下议论，但没有人为你说话。你是这个互动情境的参与者。',
        question: '面对这种对待，你会如何反应？',
        choices: [
            { key: 'confront', text: '私下找经理沟通，指出这种区别对待', tags: { voiceConcern: 2, interactional: 2, rejectUnfair: 1 } },
            { key: 'document', text: '记录事件经过，向人力资源部门反映', tags: { voiceConcern: 2, procedural: 1, interactional: 1 } },
            { key: 'withdraw', text: '感到受伤但选择沉默，减少与经理的互动', tags: { acceptUnfair: 1, interactional: 1 } },
            { key: 'reflect', text: '反思是否自己的表达方式有问题', tags: { acceptUnfair: 1 } }
        ],
        ratings: ['互动公平程度', '程序公平程度', '分配公平程度']
    },

    inter_beneficiary_dominator: {
        id: 'inter_beneficiary_dominator',
        dimension: 'interactional',
        perspective: 'beneficiary',
        role: 'dominator',
        narrative: '你是一家餐厅的主管，负责管理服务员团队。今天有两名服务员犯了类似的错误：你的好友小张忘记给一桌客人上菜；另一位服务员小李迟到了 10 分钟。你需要决定如何与他们沟通。你是处理方式的支配者。',
        question: '你会如何处理这两件事？',
        choices: [
            { key: 'equal_treatment', text: '以同等严肃的态度分别与两人私下沟通', tags: { interactional: 2, procedural: 1 } },
            { key: 'context_aware', text: '考虑具体情况分别处理，但态度一致', tags: { interactional: 1 } },
            { key: 'favor_friend', text: '对小李严肃批评，对小张轻描淡写', tags: { interactional: -2, acceptUnfair: -2 } },
            { key: 'public_scold', text: '在全体面前批评小李，私下提醒小张', tags: { interactional: -3, acceptUnfair: -2 } }
        ],
        ratings: ['互动公平程度', '程序公平程度', '分配公平程度']
    },

    inter_bystander_participant: {
        id: 'inter_bystander_participant',
        dimension: 'interactional',
        perspective: 'bystander',
        role: 'participant',
        narrative: '在课间休息时，你目睹了以下场景：老师因为学生 A 上课讲话而严厉批评了他，让他站到教室后面。但就在五分钟前，学生 B 也在讲话，老师只是温和地提醒了一句。学生 A 看起来很不服气。你是班级的一员，参与了这次课堂互动。',
        question: '作为旁观者，你会怎么做？',
        choices: [
            { key: 'speak_fair', text: '向老师指出两位学生受到了不同的对待', tags: { intervene: 2, interactional: 2, voiceConcern: 2 } },
            { key: 'comfort', text: '课后安慰学生 A，但不向老师反映', tags: { voiceConcern: 1, interactional: 1 } },
            { key: 'ignore', text: '不介入，认为老师有权决定如何处理', tags: { acceptUnfair: 1 } },
            { key: 'blame_a', text: '认为 A 被罚是因为他态度不好', tags: { acceptUnfair: 2, interactional: -1 } }
        ],
        ratings: ['互动公平程度', '程序公平程度', '分配公平程度']
    }
};

// ---------- 自适应后续场景 ----------
const ADAPTIVE_SCENARIOS = {

    followup_reject_distributive: {
        id: 'followup_reject_distributive',
        dimension: 'distributive',
        perspective: 'victim',
        role: 'participant',
        trigger: (profile) => profile.rejectUnfair >= 2 && profile.distributive >= 2,
        narrative: '【后续场景】在上一个类似情境中，你选择了维护分配公平。现在，你的上司私下找到你，表示可以帮你争取更好的分配，但前提是你不再"闹事"，并在下次评选中支持他的决定。分配方案本身没有变化。',
        question: '你会如何回应上司的提议？',
        choices: [
            { key: 'refuse_deal', text: '拒绝交易，坚持通过正当渠道争取公平', tags: { rejectUnfair: 2, procedural: 2 } },
            { key: 'negotiate_both', text: '同意不再公开反对，但要求改善分配', tags: { voiceConcern: 1, distributive: 1 } },
            { key: 'accept_deal', text: '接受提议，换取个人利益', tags: { acceptUnfair: 2, prioritizeOutcome: 2 } },
            { key: 'report', text: '向上级或监察部门举报这种交易', tags: { rejectUnfair: 2, procedural: 2, intervene: 1 } }
        ],
        ratings: ['整体公平程度', '个人原则坚守程度']
    },

    followup_accept_inconsistency: {
        id: 'followup_accept_inconsistency',
        dimension: 'procedural',
        perspective: 'bystander',
        role: 'participant',
        trigger: (profile) => profile.acceptUnfair >= 2 && profile.intervene >= 1,
        narrative: '【后续场景】此前你在某些情境中选择了接受不公正的结果，但在另一些情境中选择了介入。现在，你的好朋友遇到了不公平待遇——他被莫须有的理由降职了，而你知道真正的决策者正是你之前选择"不介入"的那位领导。',
        question: '这次你还会选择不介入吗？',
        choices: [
            { key: 'help_friend', text: '这次站出来帮助朋友，即使需要面对之前的领导', tags: { intervene: 2, voiceConcern: 2 } },
            { key: 'private_help', text: '私下帮助朋友想办法，但不公开对抗', tags: { voiceConcern: 1 } },
            { key: 'same_as_before', text: '仍然选择不介入，保持一贯态度', tags: { acceptUnfair: 1 } },
            { key: 'advise_accept', text: '劝朋友接受现实，避免激化矛盾', tags: { acceptUnfair: 2 } }
        ],
        ratings: ['一致性程度', '整体公平程度']
    },

    followup_procedural_focus: {
        id: 'followup_procedural_focus',
        dimension: 'procedural',
        perspective: 'victim',
        role: 'participant',
        trigger: (profile) => profile.procedural >= 3 && profile.prioritizeOutcome < 2,
        narrative: '【后续场景】你一直重视程序的公正性。现在，公司推出了一项新政策：所有绩效评估必须通过三级审核、同事互评和自评陈述，流程公正透明。但最终结果显示你的绩效评级下降了，而一位你认为是靠关系获得好评的同事反而上升了。过程完全合规。',
        question: '面对这个合规但不满意的结果，你的态度是？',
        choices: [
            { key: 'accept_process', text: '接受结果，因为程序是公正的', tags: { procedural: 2, prioritizeOutcome: -1 } },
            { key: 'question_criteria', text: '认可程序但质疑评估标准是否合理', tags: { procedural: 1, distributive: 1 } },
            { key: 'reject_outcome', text: '虽然程序公正，但结果不公，要求复核', tags: { distributive: 2, rejectUnfair: 1 } },
            { key: 'appeal', text: '提出申诉，同时建议改进评估标准', tags: { procedural: 1, distributive: 1, voiceConcern: 2 } }
        ],
        ratings: ['程序公平程度', '分配公平程度']
    },

    followup_interactional_dominator: {
        id: 'followup_interactional_dominator',
        dimension: 'interactional',

// ---------- 工具函数 ----------
function shuffleArray(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function buildMetaTags(scenario) {
    const dimClass = 'tag-' + scenario.dimension;
    const perspClass = 'tag-' + scenario.perspective;
    const roleClass = 'tag-' + scenario.role;
    return `<div class="meta-tags">
        <span class="meta-tag ${dimClass}">${DIMENSION_LABELS[scenario.dimension]}</span>
        <span class="meta-tag ${perspClass}">${PERSPECTIVE_LABELS[scenario.perspective]}</span>
        <span class="meta-tag ${roleClass}">${ROLE_LABELS[scenario.role]}</span>
    </div>`;
}

function buildScenarioHTML(scenario, index, total) {
    const progress = Math.round((index / total) * 100);
    return `<div class="game-container">
        <div class="progress-text">场景 ${index} / ${total}</div>
        <div class="progress-bar-container">
            <div class="progress-bar-fill" style="width: ${progress}%"></div>
        </div>
        ${buildMetaTags(scenario)}
        <div class="scenario-narrative">${scenario.narrative}</div>
        <div class="scenario-question">${scenario.question}</div>
    </div>`;
}

function updateProfile(tags) {
    if (!tags) return;
    for (const [key, value] of Object.entries(tags)) {
        if (gameState.profile[key] !== undefined) {
            gameState.profile[key] += value;
        }
    }
}

function buildInitialQueue() {
    const byDimension = { distributive: [], procedural: [], interactional: [] };
    for (const id of Object.keys(SCENARIO_POOL)) {
        const s = SCENARIO_POOL[id];
        byDimension[s.dimension].push(s);
    }
    const queue = [];
    for (const dim of ['distributive', 'procedural', 'interactional']) {
        const pool = byDimension[dim];
        queue.push(pool[Math.floor(Math.random() * pool.length)]);
    }
    return shuffleArray(queue);
}

function selectAdaptiveScenarios(count) {
    const used = new Set(gameState.responses.map(r => r.scenarioId));
    const fallback = ADAPTIVE_SCENARIOS.followup_mixed_profile;

    const specific = shuffleArray(
        Object.values(ADAPTIVE_SCENARIOS)
            .filter(s => s.id !== fallback.id)
            .filter(s => !used.has(s.id))
            .filter(s => s.trigger(gameState.profile))
    );

    const selected = specific.slice(0, count);

    if (!used.has(fallback.id) && !selected.find(s => s.id === fallback.id)) {
        selected.push(fallback);
    }

    while (selected.length < count) {
        const remaining = Object.values(ADAPTIVE_SCENARIOS)
            .filter(s => !used.has(s.id) && !selected.find(x => x.id === s.id));
        if (remaining.length === 0) break;
        selected.push(remaining[Math.floor(Math.random() * remaining.length)]);
    }

    return selected.slice(0, count);
}

function buildProfileSummary() {
    const maxVal = Math.max(
        Math.abs(gameState.profile.distributive),
        Math.abs(gameState.profile.procedural),
        Math.abs(gameState.profile.interactional),
        1
    );
    const pct = (v) => Math.min(100, Math.round((Math.max(0, v) / maxVal) * 100));

    let dominant = '综合型';
    const dims = {
        '分配公平': gameState.profile.distributive,
        '程序公平': gameState.profile.procedural,
        '互动公平': gameState.profile.interactional
    };
    const sorted = Object.entries(dims).sort((a, b) => b[1] - a[1]);
    if (sorted[0][1] > 0) dominant = sorted[0][0] + '导向';

    let tendency = '温和型';
    if (gameState.profile.rejectUnfair >= 3) tendency = '原则坚守型';
    else if (gameState.profile.intervene >= 3) tendency = '积极介入型';
    else if (gameState.profile.acceptUnfair >= 3) tendency = '务实接受型';
    else if (gameState.profile.voiceConcern >= 3) tendency = '发声表达型';

    return `<div class="game-container">
        <div class="game-title">测试完成</div>
        <div class="game-subtitle">您的公平观念画像</div>
        <div class="summary-card">
            <h4>主导公平维度：${dominant}</h4>
            <h4>行为倾向：${tendency}</h4>
        </div>
        <div class="summary-card">
            <h4>三维度公平关注度</h4>
            <div class="profile-bar">
                <span class="profile-label">分配公平</span>
                <div class="profile-track"><div class="profile-fill fill-distributive" style="width:${pct(gameState.profile.distributive)}%"></div></div>
            </div>
            <div class="profile-bar">
                <span class="profile-label">程序公平</span>
                <div class="profile-track"><div class="profile-fill fill-procedural" style="width:${pct(gameState.profile.procedural)}%"></div></div>
            </div>
            <div class="profile-bar">
                <span class="profile-label">互动公平</span>
                <div class="profile-track"><div class="profile-fill fill-interactional" style="width:${pct(gameState.profile.interactional)}%"></div></div>
            </div>
        </div>
        <p style="text-align:center;color:#718096;">共完成 ${gameState.responses.length} 个场景。数据将自动下载保存。</p>
        <p style="text-align:center;">按任意键结束。</p>
    </div>`;
}

function downloadCSV(csvContent, filename) {
    const blob = new Blob(['\ufeff' + csvContent], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = filename;
    link.click();
    URL.revokeObjectURL(link.href);
}

function exportData() {
    const headers = [
        'subjectID', 'scenarioIndex', 'scenarioId', 'dimension', 'perspective', 'role',
        'isAdaptive', 'choiceKey', 'choiceText', 'fairnessRatings', 'textResponse',
        'rt_choice', 'rt_rating', 'rt_text', 'timestamp'
    ];
    let csv = headers.join(',') + '\n';
    for (const r of gameState.responses) {
        const row = headers.map(h => {
            let v = r[h];
            if (v === undefined || v === null) v = '';
            if (typeof v === 'object') v = JSON.stringify(v);
            v = String(v).replace(/"/g, '""');
            if (v.includes(',') || v.includes('"') || v.includes('\n')) v = `"${v}"`;
            return v;
        });
        csv += row.join(',') + '\n';
    }

    const profileHeaders = ['subjectID', 'distributive', 'procedural', 'interactional',
        'acceptUnfair', 'rejectUnfair', 'intervene', 'voiceConcern',
        'prioritizeProcedure', 'prioritizeOutcome', 'prioritizeInteraction'];
    let profileCSV = profileHeaders.join(',') + '\n';
    const profileRow = profileHeaders.map(h => {
        if (h === 'subjectID') return gameState.subjectID;
        return gameState.profile[h] || 0;
    });
    profileCSV += profileRow.join(',') + '\n';

    const ts = new Date().toISOString().slice(0, 19).replace(/:/g, '-');
    downloadCSV(csv, `FairnessGame_${gameState.subjectID}_${ts}.csv`);
    downloadCSV(profileCSV, `FairnessProfile_${gameState.subjectID}_${ts}.csv`);
}

// ---------- 构建 jsPsych 时间线 ----------
function createScenarioTrials(scenario, index, total) {
    const trials = [];
    const isAdaptive = !SCENARIO_POOL[scenario.id];
    const scenarioRecord = {};

    const choiceTrial = {
        type: jsPsychHtmlButtonResponse,
        stimulus: buildScenarioHTML(scenario, index, total),
        choices: scenario.choices.map(c => c.text),
        button_html: function(choice) {
            return '<button class="jspsych-btn choice-btn">' + choice + '</button>';
        },
        data: {
            trial_type: 'scenario_choice',
            scenario_id: scenario.id,
            dimension: scenario.dimension,
            perspective: scenario.perspective,
            role: scenario.role,
            is_adaptive: isAdaptive,
            scenario_index: index
        },
        on_finish: function(data) {
            const choiceIdx = data.response;
            const choice = scenario.choices[choiceIdx];
            scenarioRecord.choiceKey = choice.key;
            scenarioRecord.choiceText = choice.text;
            scenarioRecord.rt_choice = data.rt;
            data.choice_key = choice.key;
            data.choice_text = choice.text;
            data.choice_tags = choice.tags;
            updateProfile(choice.tags);
        }
    };
    trials.push(choiceTrial);

    const likertQuestions = scenario.ratings.map((label, i) => ({
        prompt: label,
        name: 'Q' + i,
        labels: ['1<br>极不公平', '2', '3<br>一般', '4', '5<br>极公平'],
        required: true
    }));

    const ratingTrial = {
        type: jsPsychSurveyLikert,
        preamble: `<div class="game-container">
            <div class="rating-prompt">请对刚才的情境进行公平性评分（1 = 极不公平，5 = 极公平）</div>
        </div>`,
        questions: likertQuestions,
        data: {
            trial_type: 'scenario_rating',
            scenario_id: scenario.id,
            scenario_index: index
        },
        on_finish: function(data) {
            const ratings = {};
            scenario.ratings.forEach((label, i) => {
                const val = data.response['Q' + i];
                ratings[label] = parseInt(val, 10) + 1;
            });
            scenarioRecord.fairnessRatings = ratings;
            scenarioRecord.rt_rating = data.rt;
            data.fairness_ratings = ratings;
        }
    };
    trials.push(ratingTrial);

    const textTrial = {
        type: jsPsychSurveyText,
        questions: [
            { prompt: '请用自己的话描述：你为什么会做出刚才的选择？你认为怎样做才算是"公平"的？', name: 'Q0', rows: 4, columns: 60, required: true }
        ],
        data: {
            trial_type: 'scenario_text',
            scenario_id: scenario.id,
            scenario_index: index
        },
        on_finish: function(data) {
            const textResponse = data.response.Q0 || Object.values(data.response)[0];
            data.text_response = textResponse;

            gameState.responses.push({
                subjectID: gameState.subjectID,
                scenarioIndex: index,
                scenarioId: scenario.id,
                dimension: scenario.dimension,
                perspective: scenario.perspective,
                role: scenario.role,
                isAdaptive: isAdaptive,
                choiceKey: scenarioRecord.choiceKey,
                choiceText: scenarioRecord.choiceText,
                fairnessRatings: scenarioRecord.fairnessRatings,
                textResponse: textResponse,
                rt_choice: scenarioRecord.rt_choice,
                rt_rating: scenarioRecord.rt_rating,
                rt_text: data.rt,
                timestamp: new Date().toISOString()
            });
        }
    };
    trials.push(textTrial);

    return trials;
}

            type: jsPsychSurveyText,
            questions: [
                { prompt: '请用自己的话描述：你为什么会做出刚才的选择？你认为怎样做才算是"公平"的？', name: 'Q0', rows: 4, columns: 60, required: true }
            ],
            data: function() {
                const scenario = gameState.scenarioQueue[gameState.scenarioPtr];
                return {
                    trial_type: 'scenario_text',
                    scenario_id: scenario.id,
                    scenario_index: gameState.scenarioPtr + 1
                };
            },
            on_finish: function(data) {
                const scenario = gameState.scenarioQueue[gameState.scenarioPtr];
                const textResponse = data.response.Q0 || Object.values(data.response)[0];
                const isAdaptive = !SCENARIO_POOL[scenario.id];

                gameState.responses.push({
                    subjectID: gameState.subjectID,
                    scenarioIndex: gameState.scenarioPtr + 1,
                    scenarioId: scenario.id,
                    dimension: scenario.dimension,
                    perspective: scenario.perspective,
                    role: scenario.role,
                    isAdaptive: isAdaptive,
                    choiceKey: gameState.currentRecord.choiceKey,
                    choiceText: gameState.currentRecord.choiceText,
                    fairnessRatings: gameState.currentRecord.fairnessRatings,
                    textResponse: textResponse,
                    rt_choice: gameState.currentRecord.rt_choice,
                    rt_rating: gameState.currentRecord.rt_rating,
                    rt_text: data.rt,
                    timestamp: new Date().toISOString()
                });
            }
        }
    ],
    loop_function: function() {
        gameState.scenarioPtr++;
        if (gameState.scenarioPtr === 3 && !gameState.adaptiveLoaded) {
            gameState.scenarioQueue = gameState.scenarioQueue.concat(selectAdaptiveScenarios(5));
            gameState.adaptiveLoaded = true;
        }
        gameState.currentRecord = {};
        return gameState.scenarioPtr < gameState.scenarioQueue.length;
    }
};

finalTimeline.push(scenarioLoop);

finalTimeline.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: function() {
        return buildProfileSummary();
    },
    choices: [' '],
    on_finish: function() {
        exportData();
    },
    data: { trial_type: 'debrief' }
});

jsPsych.run(finalTimeline);
</script>
</html>
