<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公平观念互动测试（通用生活版）</title>

    <script src="./jspsych/jspsych.js"></script>
    <link rel="stylesheet" href="./jspsych/jspsych.css">
    <script src="./jspsych/plugin-html-button-response.js"></script>
    <script src="./jspsych/plugin-html-keyboard-response.js"></script>
    <script src="./jspsych/plugin-survey-text.js"></script>
    <script src="./jspsych/plugin-survey-likert.js"></script>
    <script src="./jspsych/plugin-call-function.js"></script>

    <link rel="stylesheet" href="./js/fairness-game.css">
</head>
<body></body>
<script src="./js/fairness-scenarios-general.js"></script>
<script src="./js/fairness-game-core.js"></script>
<script>
FairnessGameCore.run({
    totalRounds: 72,
    textInterval: 6,
    welcomeHTML: `<div class="game-container">
        <div class="game-title">公平观念互动测试</div>
        <div class="game-subtitle">通用生活版 · Fairness Perception Game</div>
        <div class="instruction-list">
            <p>欢迎参加公平观念互动测试。本测试通过 <strong>72 轮</strong>生活化对话场景，了解您对公平的理解。</p>
            <p>三个公平维度：</p>
            <ul>
                <li><strong>分配公平</strong>——资源/结果是否合理</li>
                <li><strong>程序公平</strong>——决策过程是否公正透明</li>
                <li><strong>互动公平</strong>——互动中是否受到尊重</li>
            </ul>
            <p>您将以<strong>受害者、获利者、旁观者</strong>视角，以及<strong>参与者、支配者</strong>角色体验情境。每 9 轮根据您的回答生成自适应场景。</p>
            <p>结束后将在<strong>三维公平地图</strong>上确认您的公平观念位置。全程约 60–90 分钟。按 <strong>空格键</strong> 开始。</p>
        </div>
    </div>`,
    instructionHTML: `<div class="game-container">
        <div class="game-title">测试说明</div>
        <div class="instruction-list">
            <p>每轮包含：</p>
            <ol>
                <li>阅读场景 → 做出选择</li>
                <li>对三个公平维度评分（1–5）</li>
                <li>每 6 轮一次文字描述（解释您的公平观念）</li>
            </ol>
            <p>共 <strong>72 轮</strong>。请根据真实想法作答。按 <strong>空格键</strong> 继续。</p>
        </div>
    </div>`
}, window.FAIRNESS_SCENARIO_PACK);
</script>
</html>
