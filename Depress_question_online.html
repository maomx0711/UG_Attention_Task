/* Helper Function: Create Question Block */
function createQuestionBlock(question, options, scale_name) {
    return {
        type: jsPsychHtmlButtonResponse,
        stimulus: function() {
            let html = `<div class="scale-question">
                <div class="question-text">${question.prompt}</div>
                <div class="option-container">`
            
            for (let i = 0; i < options.length; i++) {
                html += `<label class="option-label" data-choice="${i}">
                    <input type="radio" name="${question.name}" value="${i}" required>
                    <span>${options[i]}</span>
                </label>`
            }
            
            html += `</div></div>`
            return html
        },
        choices: ['下一题'],
        on_load: function() {
            // 只有选择后才能点击按钮
            let button = document.querySelector('.jspsych-btn')
            button.disabled = true
            
            let labels = document.querySelectorAll('.option-label')
            let radios = document.querySelectorAll('input[type="radio"]')
            
            // 点击label时添加选中样式
            labels.forEach(function(label) {
                label.addEventListener('click', function() {
                    // 移除所有选中样式
                    labels.forEach(l => l.classList.remove('selected'))
                    // 添加当前选中样式
                    label.classList.add('selected')
                    button.disabled = false
                })
            })
            
            radios.forEach(function(radio) {
                radio.addEventListener('change', function() {
                    button.disabled = false
                })
            })
        },
        on_finish: function(data) {
            let selected = document.querySelector('input[name="' + question.name + '"]:checked')
            if (selected) {
                data.question = question.prompt
                data.response = parseInt(selected.value)
                data.scale = scale_name
                data.item = question.name
            }
        }
    }
}

var calculate_scores = {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: function() {
        var data = jsPsych.data.get()
        
        // 计算 BDI 总分
        var bdi_data = data.filter({scale: 'BDI'})
        var bdi_score = 0
        bdi_data.values().forEach(function(trial) {
            if (trial.response !== undefined) {
                bdi_score += trial.response
            }
        })
        
        // 计算 STAI-S 总分
        var stai_s_data = data.filter({scale: 'STAI_S'})
        var stai_s_score = 0
        stai_s_data.values().forEach(function(trial) {
            if (trial.response !== undefined) {
                stai_s_score += (trial.response + 1) // 转换为1-4分
            }
        })
        
        // 计算 STAI-T 总分
        var stai_t_data = data.filter({scale: 'STAI_T'})
        var stai_t_score = 0
        stai_t_data.values().forEach(function(trial) {
            if (trial.response !== undefined) {
                stai_t_score += (trial.response + 1) // 转换为1-4分
            }
        })
        
        // 解释
        var bdi_interpretation = ''
        if (bdi_score <= 13) {
            bdi_interpretation = '正常范围'
        } else if (bdi_score <= 19) {
            bdi_interpretation = '轻度抑郁'
        } else if (bdi_score <= 28) {
            bdi_interpretation = '中度抑郁'
        } else {
            bdi_interpretation = '重度抑郁'
        }
        
        var stai_s_interpretation = ''
        if (stai_s_score < 40) {
            stai_s_interpretation = '低焦虑'
        } else if (stai_s_score <= 60) {
            stai_s_interpretation = '中等焦虑'
        } else {
            stai_s_interpretation = '高焦虑'
        }
        
        var stai_t_interpretation = ''
        if (stai_t_score < 40) {
            stai_t_interpretation = '低焦虑'
        } else if (stai_t_score <= 60) {
            stai_t_interpretation = '中等焦虑'
        } else {
            stai_t_interpretation = '高焦虑'
        }
        
        return `
        <div style="text-align: left; max-width: 800px; margin: auto;">
        <h2>测评结果</h2>
        <p style="font-size: 18pt; line-height: 2em;">
        <b>贝克抑郁量表（BDI-II）：</b><br/>
        您的得分：<span style="color: #e74c3c; font-size: 24pt;"><b>${bdi_score}</b></span> 分<br/>
        评估结果：${bdi_interpretation}<br/>
        （0-13分：正常；14-19分：轻度；20-28分：中度；29-63分：重度）<br/>
        <br/>
        <b>状态焦虑量表（STAI-S）：</b><br/>

        评估结果：${stai_s_interpretation}<br/>

        评估结果：${stai_t_interpretation}<br/>
        （20-39分：低焦虑；40-60分：中等焦虑；61-80分：高焦虑）<br/>

        <span style="color: #e67e22;">

        </p>
        </div>`
    },
    on_finish: function(data) {
        data.varname = 'final_scores'
    }
}

var thank_you = {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `
    <div style="text-align: center;">

for (let i = 0; i < BDI_questions.length; i++) {
