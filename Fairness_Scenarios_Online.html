function randomID(length) {
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
    let result = '';
    for (let i = 0; i < length; i++) {
        result += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    return result;
}

const DIM_ORDER = ['distributive', 'procedural', 'interactional'];
const PERSP_ORDER = ['victim', 'beneficiary', 'bystander'];

function buildScenarioList(role) {
    const list = [];
    for (const dim of DIM_ORDER) {
        for (const persp of PERSP_ORDER) {
            const s = SCENARIOS[role][dim][persp];
            list.push({ dim, persp, title: s.title, text: s.text });
        }
    }
    return list;
}

function shuffleArray(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

        <p>本任务将呈现一系列基于<strong>组织公平理论</strong>的经典工作情境。请仔细阅读每个场景，想象自己身处其中，然后描述<strong>您认为自己会采取的行为</strong>。</p>

        <div class="dim-grid">
            <div class="dim-card">
                <h4 style="color:#1565c0;">分配公平</h4>
                <p>资源、报酬或结果分配是否公正合理</p>
            </div>
            <div class="dim-card">
                <h4 style="color:#2e7d32;">程序公平</h4>
                <p>决策过程、规则与程序是否公正透明</p>
            </div>
            <div class="dim-card">
                <h4 style="color:#c62828;">互动公平</h4>
                <p>人际对待方式是否尊重、诚恳与得体</p>
            </div>
        </div>

        <p>每个情境将从三种<strong>视角</strong>呈现：</p>
        <p>
            <span class="persp-badge persp-victim">受害者视角</span> 利益受损的一方 &nbsp;
            <span class="persp-badge persp-beneficiary">获利者视角</span> 相对获益的一方 &nbsp;
            <span class="persp-badge persp-bystander">旁观者视角</span> 在场但未直接受影响的一方
        </p>

        <p style="margin-top:20px;">实验编号：<strong>${subID}</strong></p>
        <p style="text-align:center; margin-top:28px; color:#2d6a9f;"><strong>按任意键继续</strong></p>
    </div>`
};

const instructions = {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `
    <div class="page-card">
        <div class="page-title">指导语</div>
        <p><strong>1. 角色选择</strong><br>接下来，您将选择（或由系统分配）一种角色：</p>
        <p>
            <span class="role-badge role-participant">参与者</span> 组织中的普通成员（员工），体验公平或不公情境<br>
            <span class="role-badge role-dominator">支配者</span> 拥有决策权和资源分配权的管理者
        </p>
        <p><strong>2. 情境阅读</strong><br>共 9 个情境，涵盖三种公平维度与三种视角。请尽量将自己<strong>代入场景</strong>，想象真实情况。</p>
        <p><strong>3. 行为描述</strong><br>每个情境后，请用<strong>自己的语言</strong>详细描述：如果您身处该情境，<strong>您会怎么做？</strong>可以包括具体行动、沟通方式、情绪反应和后续计划。</p>
        <p><strong>4. 注意事项</strong></p>
        <ul>
            <li>没有标准答案，请根据真实想法作答</li>
            <li>每个情境至少写 2-3 句话</li>
            <li>请独立完成，不要与他人讨论</li>
        </ul>
        <p style="text-align:center; margin-top:28px; color:#2d6a9f;"><strong>按任意键选择角色</strong></p>
    </div>`
};

timeline.push(welcome, instructions);

const roleSelection = {
    type: jsPsychHtmlButtonResponse,
    stimulus: `
    <div class="page-card">
        <div class="page-title">请选择您的角色</div>
        <p style="text-align:center; color:#5a6d82;">选择后，所有情境将以此角色视角呈现</p>
    </div>`,
    choices: ['__role_participant__', '__role_dominator__', '__role_random__'],
    button_html: [
        `<button class="role-select-btn">
            <strong>👤 参与者</strong>
            您是组织中的普通员工，体验作为团队成员遭遇或目睹各种公平情境
        </button>`,
        `<button class="role-select-btn">
            <strong>👔 支配者</strong>
            您是拥有决策权的管理者，面对下属的诉求、团队的不满或分配后的局面
        </button>`,
        `<button class="role-select-btn">
            <strong>🎲 随机分配</strong>
            由系统随机决定您的角色（参与者或支配者）
        </button>`
    ],
    on_finish: function(data) {
        const choice = data.response;
        if (choice === 0) selectedRole = 'participant';
        else if (choice === 1) selectedRole = 'dominator';
        else selectedRole = Math.random() < 0.5 ? 'participant' : 'dominator';
        data.assigned_role = selectedRole;
    }
};

timeline.push(roleSelection);

const roleConfirm = {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: function() {
        const roleLabel = selectedRole === 'participant' ? '参与者' : '支配者';
        const roleDesc = selectedRole === 'participant'
            ? '您将以<strong>普通员工</strong>的身份，经历或目睹组织中的公平情境。'
            : '您将以<strong>管理者</strong>的身份，面对分配决策后的各种局面和员工诉求。';
        const roleCss = selectedRole === 'participant' ? 'role-participant' : 'role-dominator';
        return `
        <div class="page-card" style="text-align:center;">
            <p>您的角色已确定：</p>
            <span class="role-badge ${roleCss}" style="font-size:18pt; padding:10px 24px;">${roleLabel}</span>
            <p style="margin-top:20px;">${roleDesc}</p>
            <p>接下来将呈现 <strong>9 个情境</strong>，请逐一阅读并作答。</p>
            <p style="margin-top:28px; color:#2d6a9f;"><strong>按任意键开始</strong></p>
        </div>`;
    }
};

timeline.push(roleConfirm);

function buildScenarioTrials(role) {
    const scenarios = shuffleArray(buildScenarioList(role));
    const trials = [];

    scenarios.forEach(function(sc, idx) {
        const dimInfo = DIMENSIONS[sc.dim];
        const perspInfo = PERSPECTIVES[sc.persp];
        const total = scenarios.length;
        const current = idx + 1;
        const pct = Math.round((current / total) * 100);

        trials.push({
            type: jsPsychHtmlKeyboardResponse,
            stimulus: `
            <div class="page-card">
                <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
                <div class="progress-label">情境 ${current} / ${total}</div>

                <span class="dim-badge ${dimInfo.css}">${dimInfo.label}</span>
                <span class="persp-badge ${perspInfo.css}">${perspInfo.label}</span>

                <h3 style="margin:14px 0 6px; font-size:18pt; color:#1a3a5c;">${sc.title}</h3>

                <div class="scenario-box">${sc.text}</div>

                <div class="prompt-box">
                    💭 请想象您正处于上述情境中。<strong>仔细阅读后，在下一页描述您认为自己会采取的行为。</strong>
                </div>

                <p style="text-align:center; margin-top:20px; color:#2d6a9f;"><strong>按任意键继续作答</strong></p>
            </div>`,
            data: {
                phase: 'scenario_read',
                dimension: sc.dim,
                perspective: sc.persp,
                scenario_title: sc.title,
                trial_index: current
            }
        });

        trials.push({
            type: jsPsychSurveyText,
            questions: [{
                prompt: `<div style="margin-bottom:12px;">
                    <span class="dim-badge ${dimInfo.css}">${dimInfo.label}</span>
                    <span class="persp-badge ${perspInfo.css}">${perspInfo.label}</span>
                    <strong style="margin-left:8px;">${sc.title}</strong>
                </div>
                <p>请详细描述：<strong>如果您身处该情境，您会采取什么行为？</strong></p>
                <p style="font-size:13pt; color:#777;">（可包括具体行动、说什么话、情绪和后续打算，至少2-3句话）</p>`,
                rows: 8,
                columns: 70,
                name: 'behavior_response',
                required: true
            }],
            button_label: '提交并继续',
            data: {
                phase: 'behavior_response',
                dimension: sc.dim,
                perspective: sc.persp,
                scenario_title: sc.title,
                trial_index: current
            },
            on_finish: function(data) {
                const resp = JSON.parse(data.responses);
                allResponses.push({
                    trial_index: current,
                    dimension: sc.dim,
                    dimension_label: dimInfo.label,
                    perspective: sc.persp,
                    perspective_label: perspInfo.label,
                    scenario_title: sc.title,
                    behavior: resp.behavior_response
                });
            }
        });
    });

    return trials;
}

const scenarioBlock = {
    timeline: function() {
        jsPsych.data.addProperties({ subject_id: subID, role: selectedRole });
        return buildScenarioTrials(selectedRole);
    }
};

timeline.push(scenarioBlock);

jsPsych.run(timeline);

function displayResults() {
    const roleLabel = selectedRole === 'participant' ? '参与者' : '支配者';
    const timestamp = new Date().toLocaleString('zh-CN');

    let tableRows = '';
    allResponses.forEach(function(r) {
        tableRows += `<tr>
            <td>${r.trial_index}</td>
            <td>${r.dimension_label}</td>
            <td>${r.perspective_label}</td>
            <td>${r.scenario_title}</td>
            <td>${escapeHtml(r.behavior)}</td>
        </tr>`;
    });

    const exportData = {
        subject_id: subID,
        role: selectedRole,
        role_label: roleLabel,
        timestamp: timestamp,
        responses: allResponses
    };

    document.body.innerHTML = `
    <div class="page-card" style="max-width:1000px; margin:30px auto;">
        <div class="page-title">实验完成</div>
        <p style="text-align:center;">感谢您的参与！</p>
        <p>被试编号：<strong>${subID}</strong> &nbsp;|&nbsp; 角色：<strong>${roleLabel}</strong> &nbsp;|&nbsp; 完成时间：${timestamp}</p>

        <table class="results-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>公平维度</th>
                    <th>视角</th>
                    <th>情境</th>
                    <th>您的行为描述</th>
                </tr>
            </thead>
            <tbody>${tableRows}</tbody>
        </table>

        <div style="text-align:center; margin-top:28px;">
            <button class="jspsych-btn" onclick="downloadJSON()">下载 JSON 数据</button>
            <button class="jspsych-btn" onclick="downloadCSV()">下载 CSV 数据</button>
        </div>
    </div>`;

    window._exportData = exportData;
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function downloadJSON() {
    const blob = new Blob([JSON.stringify(window._exportData, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `fairness_${subID}_${selectedRole}.json`;
    a.click();
    URL.revokeObjectURL(url);
}

function downloadCSV() {
    const d = window._exportData;
    const header = ['subject_id', 'role', 'trial_index', 'dimension', 'perspective', 'scenario_title', 'behavior'];
    const rows = d.responses.map(function(r) {
        return [d.subject_id, d.role, r.trial_index, r.dimension_label, r.perspective_label,
                '"' + r.scenario_title.replace(/"/g, '""') + '"',
                '"' + r.behavior.replace(/"/g, '""') + '"'].join(',');
    });
    const csv = '\uFEFF' + header.join(',') + '\n' + rows.join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `fairness_${subID}_${selectedRole}.csv`;
    a.click();
    URL.revokeObjectURL(url);
}

</script>
</html>
