function randomID(length) {
    let result = '';
    const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
    for (let i = 0; i < length; i++) {
        result += characters.charAt(Math.floor(Math.random() * characters.length));
    }
    return result;
}

/* 创建题目 */
function createQuestionBlock(question, options, scale_name, current, total) {
    return {
        type: jsPsychHtmlButtonResponse,
        stimulus: function() {
            let html = `<div class="scale-question">
                <div class="progress-bar">问题 ${current} / ${total}</div>
                <div class="question-text">${question.prompt}</div>
                <div class="option-container">`
            
            for (let i = 0; i < options.length; i++) {
                html += `<label class="option-label" data-choice="${i}">
                    <input type="radio" name="${question.name}" value="${i}" required>
                    <span>${options[i]}</span>
                </label>`
            }
            
            html += `</div></div>`
            return html
        },
        choices: ['下一题'],
        on_load: function() {
            let button = document.querySelector('.jspsych-btn')
            button.disabled = true
            
            let labels = document.querySelectorAll('.option-label')
            
            labels.forEach(function(label) {
                label.addEventListener('click', function() {
                    labels.forEach(l => l.classList.remove('selected'))
                    label.classList.add('selected')
                    button.disabled = false
                })
            })
        },
        on_finish: function(data) {
            let selected = document.querySelector('input[name="' + question.name + '"]:checked')
            if (selected) {
                data.question = question.prompt
                data.response = parseInt(selected.value)
                data.scale = scale_name
                data.item = question.name
                data.participant_id = subID
            }
        }
    }
}

            }
        })
        
        // 计算 STAI-S 总分
        var stai_s_data = data.filter({scale: 'STAI_S'})
        var stai_s_score = 0
        stai_s_data.values().forEach(function(trial) {
            if (trial.response !== undefined) {
                stai_s_score += (trial.response + 1)
            }
        })
        
        // 计算 STAI-T 总分
        var stai_t_data = data.filter({scale: 'STAI_T'})
        var stai_t_score = 0
        stai_t_data.values().forEach(function(trial) {
            if (trial.response !== undefined) {
                stai_t_score += (trial.response + 1)
            }
        })
        
        // BDI 解释
        var bdi_level = ''
        var bdi_class = ''
        if (bdi_score <= 13) {
            bdi_level = '✅ 正常范围'
            bdi_class = 'normal'
        } else if (bdi_score <= 19) {
            bdi_level = '⚠️ 轻度抑郁'
            bdi_class = 'mild'
        } else if (bdi_score <= 28) {
            bdi_level = '⚠️ 中度抑郁'
            bdi_class = 'moderate'
        } else {
            bdi_level = '🚨 重度抑郁'
            bdi_class = 'severe'
        }
        
        // STAI-S 解释
        var stai_s_level = ''
        var stai_s_class = ''
        if (stai_s_score < 40) {
            stai_s_level = '✅ 低焦虑'
            stai_s_class = 'normal'
        } else if (stai_s_score <= 60) {
            stai_s_level = '⚠️ 中等焦虑'
            stai_s_class = 'mild'
        } else {
            stai_s_level = '🚨 高焦虑'
            stai_s_class = 'severe'
        }
        
        // STAI-T 解释
        var stai_t_level = ''
        var stai_t_class = ''
        if (stai_t_score < 40) {
            stai_t_level = '✅ 低焦虑'
            stai_t_class = 'normal'
        } else if (stai_t_score <= 60) {
            stai_t_level = '⚠️ 中等焦虑'
            stai_t_class = 'mild'
        } else {
            stai_t_level = '🚨 高焦虑'
            stai_t_class = 'severe'
        }
        
        return `
        <div style="max-width: 900px; margin: auto; text-align: left;">
        <h1 style="text-align: center; color: #2c3e50;">📊 测评结果报告</h1>
        <p style="text-align: center; color: #7f8c8d; font-size: 14pt;">
        测试编号: ${subID} | 完成时间: ${new Date().toLocaleString('zh-CN')}
        </p>
        
        <div class="result-box">
        <h2 style="color: #e74c3c;">📋 贝克抑郁量表（BDI-II）</h2>
        <div class="score-display" style="color: #e74c3c;">得分: ${bdi_score} 分</div>
        <div class="interpretation ${bdi_class}">${bdi_level}</div>
        <p style="font-size: 14pt; color: #7f8c8d;">
        参考标准: 0-13分(正常) | 14-19分(轻度) | 20-28分(中度) | 29-63分(重度)
        </p>
        </div>
        
        <div class="result-box">
        <h2 style="color: #3498db;">📋 状态焦虑量表（STAI-S）</h2>
        <div class="score-display" style="color: #3498db;">得分: ${stai_s_score} 分</div>
        <div class="interpretation ${stai_s_class}">${stai_s_level}</div>
        <p style="font-size: 14pt; color: #7f8c8d;">
        参考标准: 20-39分(低焦虑) | 40-60分(中等焦虑) | 61-80分(高焦虑)
        </p>
        </div>
        
        <div class="result-box">
        <h2 style="color: #9b59b6;">📋 特质焦虑量表（STAI-T）</h2>
        <div class="score-display" style="color: #9b59b6;">得分: ${stai_t_score} 分</div>
        <div class="interpretation ${stai_t_class}">${stai_t_level}</div>
        <p style="font-size: 14pt; color: #7f8c8d;">
        参考标准: 20-39分(低焦虑) | 40-60分(中等焦虑) | 61-80分(高焦虑)
        </p>
        </div>
        
        <div class="warning-box">
        <p style="font-size: 16pt; margin: 0;">
        <b>⚠️ 重要提示：</b><br/>
        本测评结果仅供参考，不能作为临床诊断依据。<br/>
        如果您感到困扰或结果显示较高水平，建议及时寻求专业心理咨询师或精神科医生的帮助。
        </p>
        </div>
        
        <p style="text-align: center; font-size: 14pt; color: #7f8c8d; margin-top: 30px;">
        按任意键下载详细数据文件
        </p>
        </div>`
    },
    on_finish: function(data) {
        data.varname = 'final_scores'
        data.participant_id = subID
        data.end_time = new Date().toISOString()
    }
}

/* 结束页面 */
var thank_you = {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `
    <div style="text-align: center;">
    <h1 style="color: #27ae60;">✅ 感谢您的参与！</h1>
    <p style="font-size: 20pt;">测评已完成，数据已自动保存</p>
    <p style="font-size: 16pt; color: #7f8c8d;">
    您可以关闭此页面<br/>
    如需帮助，请联系测评管理员
    </p>
    <p style="font-size: 14pt; color: #95a5a6; margin-top: 50px;">按任意键结束</p>
    </div>`,
    on_finish: function() {
        document.body.style.cursor = 'default'
    }
}

/* 构建时间线 */
var timeline = [welcome]

// BDI 部分
timeline.push(BDI_instruction)
for (let i = 0; i < BDI_questions.length; i++) {
    timeline.push(createQuestionBlock(
        BDI_questions[i], 
        BDI_questions[i].options, 
        'BDI',
        i + 1,
        BDI_questions.length
    ))
}

// STAI-S 部分
timeline.push(STAI_S_instruction)
for (let i = 0; i < STAI_S_questions.length; i++) {

        STAI_S_questions[i],

// STAI-T 部分

        i + 1,
        STAI_T_questions.length
    ))
}

timeline.push(calculate_scores)

jsPsych.run(timeline)
