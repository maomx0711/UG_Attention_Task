<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公平观念互动测试（职场工作版 · 在线）</title>

    <!-- jsPsych CDN（无需本地 jspsych 包） -->
    <script src="https://unpkg.com/jspsych@7.3.4"></script>
    <link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" rel="stylesheet" type="text/css" />
    <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-text@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-likert@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-call-function@1.1.3"></script>

    <link rel="stylesheet" href="./js/fairness-game.css">
</head>
<body></body>
<script src="./js/fairness-scenarios-workplace.js"></script>
<script src="./js/fairness-game-core.js"></script>
<script>
FairnessGameCore.run({
    online: true,
    totalRounds: 72,
    textInterval: 6,
    welcomeHTML: `<div class="game-container">
        <div class="game-title">公平观念互动测试</div>
        <div class="game-subtitle">职场工作版 · 在线运行</div>
        <div class="instruction-list">
            <p>欢迎参加<strong>职场版</strong>公平观念测试。通过 <strong>72 轮</strong>工作场景对话，测量您在组织情境中的公平观念。</p>
            <p>场景涵盖：奖金分配、晋升评优、绩效流程、上下级互动、同事关系、裁员优化等。</p>
            <p>三个维度：<strong>分配公平、程序公平、互动公平</strong>；三种视角：<strong>受害者、获利者、旁观者</strong>；两种角色：<strong>参与者、支配者</strong>。</p>
            <p>每 9 轮插入自适应后续场景。结束后在<strong>三维公平地图</strong>确认您的位置。全程约 60–90 分钟。按 <strong>空格键</strong> 开始。</p>
        </div>
    </div>`,
    instructionHTML: `<div class="game-container">
        <div class="game-title">职场版测试说明</div>
        <div class="instruction-list">
            <p>每轮流程：</p>
            <ol>
                <li>阅读职场情境 → 选择最可能采取的行动</li>
                <li>对分配/程序/互动公平分别评分</li>
                <li>每 6 轮撰写一次简短文字说明</li>
            </ol>
            <p>共 <strong>72 轮</strong>。请代入真实职场经验作答。按 <strong>空格键</strong> 继续。</p>
        </div>
    </div>`
}, window.FAIRNESS_SCENARIO_PACK);
</script>
</html>
