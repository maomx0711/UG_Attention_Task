    document.body.onselectstart = function() { return false }
    document.body.oncontextmenu = function() { return false }
    document.onkeydown = function(event) {
        if ((event.keyCode in { 27: 'Esc', 116: 'F5', 123: 'F12' }) ||
            (event.ctrlKey && event.keyCode in { 85: 'U' })
        ) { return false }
    }
}

/* 生成随机ID */
function randomID(length) {
    let result = '';
    const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
    for (let i = 0; i < length; i++) {
        result += characters.charAt(Math.floor(Math.random() * characters.length));
    }
    return result;
}

// 随机选择36题（每组6题）
function selectProblems() {
    let selected = [];
    ['A', 'B', 'C', 'D', 'E'].forEach(difficulty => {
        let difficultyProblems = ravenProblems.filter(p => p.difficulty === difficulty);
        // 随机打乱并选择前6题
        let shuffled = difficultyProblems.sort(() => Math.random() - 0.5).slice(0, 6);
        selected = selected.concat(shuffled);
    });
    return selected;
}

/* 创建矩阵题目 */
function createMatrixProblem(problem, index) {
    return {
        type: jsPsychHtmlButtonResponse,
        stimulus: function() {
            let html = `
            <div class="test-container">
                <div class="progress-info">题目 ${index + 1} / ${selectedProblems.length}</div>
                <div class="progress-bar-container">
                    <div class="progress-bar-fill" style="width: ${((index + 1) / selectedProblems.length * 100)}%"></div>
                </div>
                
                <div class="matrix-container">
                    <div class="matrix-problem">
                        <div class="matrix-grid">`
            
            // 生成3x3矩阵
            for (let i = 0; i < 9; i++) {
                if (problem.matrix[i] === null) {
                    html += `<div class="matrix-cell missing"></div>`
                } else {
                    html += `<div class="matrix-cell">${problem.matrix[i]}</div>`
                }
            }
            
            html += `</div>
                    </div>
                    
                    <div style="text-align: center; font-size: 16pt; color: #495057; margin: 20px 0;">
                        <b>请选择正确的答案填入空白处</b>
                    </div>
                    
                    <div class="options-container">`
            
            // 生成选项按钮
            for (let i = 0; i < problem.options.length; i++) {
                html += `<div class="option-button" data-choice="${i}">
                    <span class="option-number">${i + 1}</span>
                    <span>${problem.options[i]}</span>
                </div>`
            }
            
            html += `</div>
                </div>
            </div>`
            
            return html
        },
        choices: ['提交答案'],
        on_load: function() {
            let button = document.querySelector('.jspsych-btn')
            button.disabled = true
            
            let options = document.querySelectorAll('.option-button')
            let selectedOption = null
            
            options.forEach(function(option) {
                option.addEventListener('click', function() {
                    options.forEach(opt => opt.classList.remove('selected'))
                    option.classList.add('selected')
                    selectedOption = parseInt(option.getAttribute('data-choice'))
                    button.disabled = false
                })
            })
            
            // 存储选择的选项
            button.onclick = function() {
                if (selectedOption !== null) {
                    jsPsych.data.addProperties({
                        user_choice: selectedOption
                    })
                }
            }
        },
        on_finish: function(data) {
            let selectedOption = data.user_choice
            let isCorrect = (selectedOption === problem.correct)
            
            data.problem_id = problem.id
            data.difficulty = problem.difficulty
            data.correct_answer = problem.correct
            data.user_answer = selectedOption
            data.is_correct = isCorrect
            data.rule = problem.rule
            data.participant_id = subID
            data.problem_number = index + 1
        }
    }
}

var calculate_results = {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: function() {
        var data = jsPsych.data.get().filter({problem_id: /.+/})
        var correct_count = data.filter({is_correct: true}).count()
        var total_count = data.count()
        var accuracy = (correct_count / total_count * 100).toFixed(1)
        
        // 计算各难度的正确率
        var accuracy_by_level = {}
        ;['A', 'B', 'C', 'D', 'E'].forEach(level => {
            var level_data = data.filter({difficulty: level})
            var level_correct = level_data.filter({is_correct: true}).count()
            var level_total = level_data.count()
            accuracy_by_level[level] = level_total > 0 ? (level_correct / level_total * 100).toFixed(1) : 0
        })
        
        // 根据正确数估算IQ（简化版，实际需要标准化常模）
        // 标准分转换：平均分30题，标准差约8题

            iq_level = '⭐ 优秀'
            iq_description = '您的抽象推理能力优秀，高于大多数人（约前10%）。'
        } else if (iq >= 110) {
            iq_level = '✨ 中上'
            iq_description = '您的抽象推理能力中上，好于平均水平。'

            iq_level = '✅ 中等'
            iq_description = '您的抽象推理能力处于正常范围，与多数人相当。'

                <h3 style="text-align: center; color: #2c3e50;">📊 各难度等级表现</h3>
                <div style="padding: 20px;">
                    <div style="margin: 10px 0;">
                        <b>A组（基础）：</b>${accuracy_by_level['A']}% 
                        <div style="background: #e9ecef; height: 20px; border-radius: 10px; margin-top: 5px;">
                            <div style="background: linear-gradient(90deg, #51cf66, #37b24d); height: 100%; width: ${accuracy_by_level['A']}%; border-radius: 10px;"></div>

                    </div>
                    <div style="margin: 10px 0;">
                        <b>B组（简单）：</b>${accuracy_by_level['B']}%
                        <div style="background: #e9ecef; height: 20px; border-radius: 10px; margin-top: 5px;">
                            <div style="background: linear-gradient(90deg, #4dabf7, #228be6); height: 100%; width: ${accuracy_by_level['B']}%; border-radius: 10px;"></div>

                    </div>
