<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公平认知地图 — 角色扮演任务</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #1a1a2e; color: #eee;
    display: flex; justify-content: center; align-items: flex-start;
    min-height: 100vh; padding: 12px;
  }
  #app {
    width: 800px; max-width: 100%;
    background: #16213e; border-radius: 18px; padding: 22px 26px;
    box-shadow: 0 12px 40px rgba(0,0,0,.5); margin: 10px 0;
  }
  h1 { font-size: 1.25rem; text-align: center; color: #7ec8e3; margin-bottom: 4px; }
  .subtitle { text-align: center; font-size: 0.78rem; color: #8899aa; margin-bottom: 14px; }

  .progress-bar { height: 6px; background: #2a2a4a; border-radius: 3px; margin-bottom: 14px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #5c9fd4, #7ec8e3); transition: width 0.4s; }

  .dim-legend {
    display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
    margin-bottom: 14px; font-size: 0.72rem;
  }
  .dim-tag { padding: 3px 10px; border-radius: 12px; font-weight: 600; }
  .dim-distrib { background: #1a3a5c; color: #64b5f6; }
  .dim-proced  { background: #1a3d2e; color: #81c784; }
  .dim-interact{ background: #3d1a2a; color: #f48fb1; }

  #scene {
    background: #1e2d4a; border-radius: 14px; padding: 18px 20px;
    margin-bottom: 14px; min-height: 180px;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
  }
  .char-row { display: flex; align-items: center; gap: 14px; width: 100%; }
  .char-emoji { font-size: 2.8rem; flex-shrink: 0; }
  .char-info .name { font-size: 1.05rem; font-weight: 700; color: #7ec8e3; }
  .char-info .role { font-size: 0.78rem; color: #7799bb; }
  .char-info .note { font-size: 0.7rem; color: #667788; margin-top: 2px; font-style: italic; }

  .dialogue-bubble {
    background: #f0f4f8; color: #2a2a3a; border-radius: 14px 14px 14px 2px;
    padding: 12px 16px; max-width: 520px; line-height: 1.55; font-size: 0.9rem;
    align-self: flex-start; width: 100%;
  }
  .dialogue-bubble.system {
    background: #2a3550; color: #aabbcc; border-radius: 10px;
    text-align: center; font-size: 0.85rem;
  }
  .dialogue-bubble.rest {
    background: #2a3a40; color: #c8d8d0; border-radius: 10px;
    text-align: center; font-size: 0.88rem;
  }

  #choices { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-bottom: 14px; }
  .choice-btn {
    flex: 1; min-width: 200px; max-width: 360px;
    padding: 13px 15px; border-radius: 12px; border: 2px solid #3a4a6a;
    background: #1e3050; color: #ddd; font-size: 0.88rem; cursor: pointer;
    transition: all 0.18s; text-align: left; line-height: 1.45;
  }
  .choice-btn:hover { border-color: #7ec8e3; background: #253a58; transform: translateY(-2px); }
  .choice-btn .hint { display: block; font-size: 0.7rem; color: #8899aa; margin-top: 4px; }

  #status {
    display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;
    font-size: 0.78rem; color: #7799aa; margin-bottom: 12px;
  }
  #status span { background: #1a2840; padding: 4px 12px; border-radius: 20px; }

  .btn-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .btn {
    padding: 10px 22px; border-radius: 24px; border: none; cursor: pointer;
    font-size: 0.88rem; font-weight: 600; transition: all 0.18s;
  }
  .btn-primary { background: #5c9fd4; color: #0f1a2e; }
  .btn-primary:hover { background: #7ec8e3; }
  .btn-secondary { background: #2a3a5a; color: #aabbcc; }
  .btn-secondary:hover { background: #354870; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* evaluation phase */
  #eval-panel { display: none; }
  #eval-panel h3 { text-align: center; color: #7ec8e3; margin-bottom: 10px; font-size: 1rem; }
  .eval-char-header {
    display: flex; align-items: center; gap: 12px; margin-bottom: 10px;
    padding: 10px 14px; background: #1e3050; border-radius: 10px;
  }
  .eval-char-header .emoji { font-size: 2rem; }
  .eval-prompt { font-size: 0.82rem; color: #99aabb; margin-bottom: 8px; line-height: 1.5; }
  .eval-textarea {
    width: 100%; min-height: 100px; padding: 12px 14px; border-radius: 10px;
    border: 2px solid #3a4a6a; background: #0f1a2e; color: #ddd;
    font-family: inherit; font-size: 0.9rem; line-height: 1.6; resize: vertical;
  }
  .eval-textarea:focus { outline: none; border-color: #5c9fd4; }
  .eval-nav { display: flex; justify-content: space-between; margin-top: 14px; }

  /* 3D map projections */
  #map-panel { display: none; margin-bottom: 14px; }
  #map-panel h3 { font-size: 0.88rem; color: #8899bb; text-align: center; margin-bottom: 10px; }
  .map-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .map-box { text-align: center; }
  .map-box canvas { background: #0a1220; border-radius: 8px; border: 1px solid #3a4a6a; }
  .map-box .map-label { font-size: 0.68rem; color: #667788; margin-top: 4px; }

  #result { display: none; text-align: center; padding: 16px; }
  #result h3 { color: #7ec8e3; margin-bottom: 10px; }
  #result .detail { font-size: 0.82rem; color: #8899aa; line-height: 1.7; }

  .player-card {
    background: #253a58; border: 2px solid #5c9fd4; border-radius: 12px;
    padding: 12px 16px; margin-bottom: 14px; text-align: center;
  }
  .player-card .label { font-size: 0.72rem; color: #8899aa; }
  .player-card .name { font-size: 1rem; color: #7ec8e3; font-weight: 700; }
</style>
</head>
<body>

<div id="app">
  <h1>⚖️ 公平认知地图 — 角色扮演任务</h1>
  <div class="subtitle">三维组织公平空间 · 分配 × 程序 × 互动 · 大学校园版</div>

  <div class="dim-legend">
    <span class="dim-tag dim-distrib">分配公平 — 资源/结果是否公正</span>
    <span class="dim-tag dim-proced">程序公平 — 决策过程是否透明</span>
    <span class="dim-tag dim-interact">互动公平 — 对待方式是否尊重</span>
  </div>

  <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>

  <div class="player-card" id="player-card" style="display:none;">
    <div class="label">您的角色</div>
    <div class="name" id="player-name">🎓 大一新生 · 小林</div>
  </div>

  <div id="scene"></div>
  <div id="choices"></div>

  <div id="status">
    <span>阶段：<strong id="phase-label">序幕</strong></span>
    <span>互动：<strong id="round-label">0</strong>/<span id="total-rounds">27</span></span>
    <span>角色：<strong id="char-progress">0</strong>/9</span>
  </div>
  <div class="btn-row" id="btn-row"></div>

  <div id="eval-panel">
    <h3>📝 公平评价任务</h3>
    <p style="text-align:center;font-size:0.78rem;color:#8899aa;margin-bottom:14px;">
      请根据刚才的互动，用文字描述该角色在三个公平维度上的表现
    </p>
    <div id="eval-content"></div>
    <div class="eval-nav">
      <button class="btn btn-secondary" id="btn-eval-prev">← 上一位</button>
      <button class="btn btn-primary" id="btn-eval-next">下一位 →</button>
    </div>
  </div>

  <div id="map-panel">
    <h3>🗺️ 公平认知空间（三维权衡坐标 · 仅供研究者参考）</h3>
    <div class="map-row">
      <div class="map-box"><canvas id="map-dp" width="220" height="220"></canvas><div class="map-label">分配 × 程序</div></div>
      <div class="map-box"><canvas id="map-di" width="220" height="220"></canvas><div class="map-label">分配 × 互动</div></div>
      <div class="map-box"><canvas id="map-pi" width="220" height="220"></canvas><div class="map-label">程序 × 互动</div></div>
    </div>
  </div>

  <div id="result"></div>
</div>

<script>

  // ---- 李主席 c1 高分配/低程序/低互动 ----

  { charId:'c7', text:'「转专业申请表？截止日期过了三天，规矩就是规矩，没法通融。」',
    options:[
      { text:'老师，能否了解一下迟交的具体处理依据？', hint:'理性询问', dD:0.00, dP:0.10, dI:0.08 },
      { text:'就差三天，能不能帮帮忙？', hint:'求情', dD:-0.05, dP:-0.05, dI:0.05 },
    ]},
  { charId:'c7', text:'「成绩复议？把材料放这儿吧，什么时候有结果通知你，别催。」（头也没抬）',
    options:[
      { text:'好的老师，请问大概需要多长时间？', hint:'礼貌', dD:0.00, dP:0.05, dI:0.05 },
      { text:'复议有没有明确的处理时限和流程？', hint:'追问程序', dD:0.00, dP:0.12, dI:0.08 },
    ]},
  { charId:'c7', text:'「学生证补办要本人来，带身份证、填表、交20块，三个工作日取。流程写墙上了，自己看。」',
    options:[
      { text:'好的，我按流程准备材料。', hint:'配合', dD:0.00, dP:0.05, dI:0.00 },
      { text:'这流程也太繁琐了，能不能简化？', hint:'抱怨', dD:0.00, dP:-0.05, dI:-0.08 },
    ]},

  // ---- 小吴 c8 低/低/低 ----
  { charId:'c8', text:'「实习名额？我爸跟那家公司的老总认识，打个招呼就行。你投简历估计也排不上。」',
    options:[
      { text:'……那祝你顺利。', hint:'沉默', dD:-0.05, dP:0.00, dI:-0.05 },
      { text:'实习不是应该公开竞聘吗？', hint:'质疑', dD:0.08, dP:0.10, dI:0.05 },
    ]},
  { charId:'c8', text:'「奖学金？我年年都有啊，一些材料让秘书帮我弄的。你还自己写啊？太费劲了。」',
    options:[
      { text:'每个人情况不同吧。', hint:'平淡', dD:-0.03, dP:0.00, dI:0.00 },
      { text:'这样对其他认真准备的同学不太公平吧。', hint:'直言', dD:0.10, dP:0.08, dI:0.05 },
    ]},
  { charId:'c8', text:'「社团部长？早内定好了，我哥们。你竞选也没戏，别浪费时间了。」（漫不经心）',
    options:[
      { text:'选举不是应该公开透明的吗？', hint:'质疑', dD:0.08, dP:0.12, dI:0.08 },
      { text:'好吧，那我不报了。', hint:'放弃', dD:-0.05, dP:-0.05, dI:-0.08 },
    ]},
];

const state = {
  phase: 'intro',
  round: 0,
  totalRounds: INTERACTIONS.length,
  interactionOrder: [],
  introStep: 0,
  restBreaks: [9, 18],
  restTaken: {},
  perceived: {},
  choiceLog: [],
  evalIndex: 0,
  evaluations: {},
  overallEval: '',
};

function initState() {
  state.phase = 'intro';
  state.round = 0;
  state.interactionOrder = shuffle([...Array(INTERACTIONS.length).keys()]);
  state.introStep = 0;
  state.restTaken = {};
  state.choiceLog = [];
  state.evalIndex = 0;
  state.evaluations = {};
  state.overallEval = '';
  state.perceived = {};
  CHARACTERS.forEach(c => {
    state.perceived[c.id] = { distrib: 0, proced: 0, interact: 0 };
    state.evaluations[c.id] = '';
  });
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function render() {
  const pct = state.phase === 'playing' ? (state.round / state.totalRounds) * 100
    : state.phase === 'eval' ? 90 + (state.evalIndex / (CHARACTERS.length + 1)) * 10
    : state.phase === 'result' ? 100 : (state.introStep / 5) * 15;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('phase-label').textContent =
    { intro:'序幕', playing:'角色互动', eval:'公平评价', result:'完成' }[state.phase] || state.phase;
  document.getElementById('round-label').textContent = state.round;
  document.getElementById('total-rounds').textContent = state.totalRounds;
  const charsDone = new Set(INTERACTIONS.slice(0, state.round).map((_, i) =>
    INTERACTIONS[state.interactionOrder[i]].charId)).size;
  document.getElementById('char-progress').textContent =
    state.phase === 'eval' ? state.evalIndex + '/' + CHARACTERS.length : charsDone + '/9';

  document.getElementById('player-card').style.display =
    state.phase === 'intro' && state.introStep < 2 ? 'none' : 'block';
  document.getElementById('eval-panel').style.display = state.phase === 'eval' ? 'block' : 'none';
  document.getElementById('map-panel').style.display = state.phase === 'result' ? 'block' : 'none';
  document.getElementById('result').style.display = state.phase === 'result' ? 'block' : 'none';

  if (state.phase === 'intro') renderIntro();
  else if (state.phase === 'playing') renderPlaying();
  else if (state.phase === 'eval') renderEval();
  else if (state.phase === 'result') renderResult();
}

function renderIntro() {
  const scene = document.getElementById('scene');
  const choices = document.getElementById('choices');
  const btnRow = document.getElementById('btn-row');
  choices.innerHTML = '';

  const steps = [
    { text: '🎓 欢迎来到大学校园！你是<strong>大一新生小林</strong>，正在适应全新的学习生活。' },
    { text: '在校园中，你将与<strong>9 位不同角色</strong>打交道——辅导员、教授、室友、班委、食堂阿姨……<br>每个人都有自己的处事方式。' },
    { text: '你需要通过<strong>互动</strong>来感知每个人在三个公平维度上的位置：<br>'
      + '<span style="color:#64b5f6">分配公平</span> · <span style="color:#81c784">程序公平</span> · <span style="color:#f48fb1">互动公平</span><br>'
      + '你看不到他们的"公平坐标"，只能凭直觉感受。' },
    { text: '你将进行 <strong>27 次互动</strong>（每位角色 3 次），每次选择你的回应方式。<br>互动结束后，请用文字<strong>评价每位角色</strong>在三个公平维度上的表现。' },
    { text: '⚠️ 没有标准答案。请根据真实感受作答，就像你真的身处校园中一样。' },
  ];

  if (state.introStep >= steps.length) {
    scene.innerHTML = '<div class="dialogue-bubble system">准备好了吗？点击下方按钮开始！</div>';
    btnRow.innerHTML = '<button class="btn btn-primary" id="btn-start">🚀 开始互动</button>';
    document.getElementById('btn-start').onclick = () => { state.phase = 'playing'; render(); };
    return;
  }
  scene.innerHTML = `<div class="dialogue-bubble system">${steps[state.introStep].text}</div>`;
  btnRow.innerHTML = `<button class="btn btn-primary" id="btn-next">▶ 继续</button>`;
  document.getElementById('btn-next').onclick = () => { state.introStep++; render(); };
}

function renderPlaying() {
  const scene = document.getElementById('scene');
  const choices = document.getElementById('choices');
  const btnRow = document.getElementById('btn-row');

  if (state.round >= state.totalRounds) {
    state.phase = 'eval';
    state.evalIndex = 0;
    render();
    return;
  }

  if (state.restBreaks.includes(state.round) && !state.restTaken[state.round]) {
    scene.innerHTML = `<div class="dialogue-bubble rest"><b>☕ 休息一下</b><br><br>已完成 <b>${state.round}</b> 次互动，起来走走吧。<br>准备好了再继续。</div>`;
    choices.innerHTML = '';
    btnRow.innerHTML = '<button class="btn btn-primary" id="btn-rest">▶ 继续</button>';
    document.getElementById('btn-rest').onclick = () => { state.restTaken[state.round] = true; render(); };
    return;
  }

  const idx = state.interactionOrder[state.round];
  const inter = INTERACTIONS[idx];
  const char = CHARACTERS.find(c => c.id === inter.charId);

  scene.innerHTML = `
    <div class="char-row">
      <div class="char-emoji">${char.emoji}</div>
      <div class="char-info">
        <div class="name">${char.name}</div>
        <div class="role">${char.role}</div>
        <div class="note">${char.note}</div>
      </div>
    </div>
    <div class="dialogue-bubble">${inter.text}</div>
  `;

  choices.innerHTML = inter.options.map((opt, i) => `
    <button class="choice-btn" data-idx="${i}">
      ${opt.text}
      <span class="hint">— ${opt.hint}</span>
    </button>
  `).join('');

  choices.querySelectorAll('.choice-btn').forEach(btn => {
    btn.onclick = function() {
      const opt = inter.options[parseInt(this.dataset.idx)];
      const pos = state.perceived[inter.charId];
      pos.distrib  = clamp(pos.distrib  + opt.dD, -1, 1);
      pos.proced   = clamp(pos.proced   + opt.dP, -1, 1);
      pos.interact = clamp(pos.interact + opt.dI, -1, 1);
      state.choiceLog.push({
        round: state.round, charId: inter.charId, charName: char.name,
        text: inter.text, choice: opt.text, hint: opt.hint
      });
      state.round++;
      render();
    };
  });

  btnRow.innerHTML = `<span style="font-size:0.78rem;color:#8899aa;">第 ${state.round + 1} / ${state.totalRounds} 次互动</span>`;
}

function renderEval() {
  document.getElementById('scene').innerHTML = '';
  document.getElementById('choices').innerHTML = '';
  document.getElementById('btn-row').innerHTML = '';

  const isOverall = state.evalIndex >= CHARACTERS.length;

  if (isOverall) {
    document.getElementById('eval-content').innerHTML = `
      <div class="eval-char-header" style="justify-content:center;">
        <div>
          <div class="name" style="color:#7ec8e3;font-size:1.1rem;">🌐 总体评价</div>
          <div class="role">综合本次所有互动经历</div>
        </div>
      </div>
      <div class="eval-prompt">
        请综合描述你对校园中<strong>公平氛围</strong>的整体感受：<br>
        · 在<strong>分配公平</strong>（资源、机会分配）方面，你的观察是什么？<br>
        · 在<strong>程序公平</strong>（决策流程与规则）方面，你的观察是什么？<br>
        · 在<strong>互动公平</strong>（人际对待方式）方面，你的观察是什么？<br>
        · 谁给你留下了最"公平"或最"不公平"的印象？为什么？
      </div>
      <textarea class="eval-textarea" id="eval-input" placeholder="请在此输入您的总体评价（至少3-5句话）…">${state.overallEval}</textarea>
    `;
    document.getElementById('btn-eval-prev').style.display = 'inline-block';
    document.getElementById('btn-eval-next').textContent = '✅ 提交完成';
  } else {
    const char = CHARACTERS[state.evalIndex];
    document.getElementById('eval-content').innerHTML = `
      <div class="eval-char-header">
        <div class="emoji">${char.emoji}</div>
        <div class="char-info">
          <div class="name">${char.name}</div>
          <div class="role">${char.role} · ${char.note}</div>
        </div>
      </div>
      <div class="eval-prompt">
        请评价 <strong>${char.name}</strong> 在以下三个公平维度上的表现（至少2-3句话）：<br>
        · <span style="color:#64b5f6">分配公平</span>：资源、机会、利益分配是否公正？<br>
        · <span style="color:#81c784">程序公平</span>：决策过程是否透明、有规则？<br>
        · <span style="color:#f48fb1">互动公平</span>：对待你的方式是否尊重、诚恳？
      </div>
      <textarea class="eval-textarea" id="eval-input" placeholder="请描述您对该角色的公平评价…">${state.evaluations[char.id] || ''}</textarea>
    `;
    document.getElementById('btn-eval-prev').style.display = state.evalIndex > 0 ? 'inline-block' : 'none';
    document.getElementById('btn-eval-next').textContent =
      state.evalIndex < CHARACTERS.length - 1 ? '下一位 →' : '总体评价 →';
  }

  const input = document.getElementById('eval-input');
  document.getElementById('btn-eval-prev').onclick = () => {
    saveCurrentEval(input.value);
    if (state.evalIndex > 0) { state.evalIndex--; renderEval(); }
  };
  document.getElementById('btn-eval-next').onclick = () => {
    if (!input.value.trim()) { alert('请填写评价内容后再继续。'); return; }
    saveCurrentEval(input.value);
    if (isOverall) {
      state.phase = 'result';
      render();
    } else {
      state.evalIndex++;
      renderEval();
    }
  };
}

function saveCurrentEval(text) {
  if (state.evalIndex >= CHARACTERS.length) {
    state.overallEval = text;
  } else {
    state.evaluations[CHARACTERS[state.evalIndex].id] = text;
  }
}

function renderResult() {
  document.getElementById('scene').innerHTML = '';
  document.getElementById('choices').innerHTML = '';
  document.getElementById('btn-row').innerHTML = '';
  drawMaps();

  let evalRows = '';
  CHARACTERS.forEach(c => {
    evalRows += `<tr><td style="padding:6px 12px;border-bottom:1px solid #2a3a5a;">${c.emoji} ${c.name}</td>`
      + `<td style="padding:6px 12px;border-bottom:1px solid #2a3a5a;text-align:left;font-size:0.8rem;color:#aabbcc;">${escHtml(state.evaluations[c.id] || '')}</td></tr>`;
  });

  document.getElementById('result').innerHTML = `
    <h3>✅ 任务完成</h3>
    <p class="detail">你完成了 27 次校园互动，并对 9 位角色及整体公平氛围进行了评价。</p>
    <table style="width:100%;margin:14px 0;border-collapse:collapse;">
      <tr><th style="padding:6px 12px;border-bottom:1px solid #3a4a6a;color:#7ec8e3;">角色</th>
          <th style="padding:6px 12px;border-bottom:1px solid #3a4a6a;color:#7ec8e3;">您的公平评价</th></tr>
      ${evalRows}
    </table>
    <div style="text-align:left;background:#1e3050;border-radius:10px;padding:14px;margin:12px 0;">
      <div style="color:#7ec8e3;font-weight:700;margin-bottom:6px;">🌐 总体评价</div>
      <div style="font-size:0.85rem;color:#aabbcc;line-height:1.6;">${escHtml(state.overallEval)}</div>
    </div>
    <div class="btn-row" style="margin-top:16px;">
      <button class="btn btn-primary" id="btn-export">📥 下载数据 (JSON)</button>
      <button class="btn btn-secondary" id="btn-restart">🔄 重新开始</button>
    </div>
  `;
  document.getElementById('btn-export').onclick = exportData;
  document.getElementById('btn-restart').onclick = () => { initState(); render(); };
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function drawMaps() {
  drawProjection('map-dp', 'distrib', 'proced', '分配', '程序');
  drawProjection('map-di', 'distrib', 'interact', '分配', '互动');
  drawProjection('map-pi', 'proced', 'interact', '程序', '互动');
}

function drawProjection(canvasId, axisX, axisY, labelX, labelY) {
  const canvas = document.getElementById(canvasId);
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height, m = 30;
  const pw = W - m * 2, ph = H - m * 2;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#0a1220';
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = '#1e3040'; ctx.lineWidth = 1;
  for (let i = 1; i < 4; i++) {
    ctx.beginPath(); ctx.moveTo(m + pw * i / 4, m); ctx.lineTo(m + pw * i / 4, H - m); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(m, m + ph * i / 4); ctx.lineTo(W - m, m + ph * i / 4); ctx.stroke();
  }
  const cx = m + pw / 2, cy = m + ph / 2;
  ctx.strokeStyle = '#445566'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(cx, m); ctx.lineTo(cx, H - m); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(m, cy); ctx.lineTo(W - m, cy); ctx.stroke();

  ctx.fillStyle = '#667788'; ctx.font = '10px Microsoft YaHei'; ctx.textAlign = 'center';
  ctx.fillText(labelX + ' →', W / 2, H - 4);
  ctx.save(); ctx.translate(10, H / 2); ctx.rotate(-Math.PI / 2);
  ctx.fillText(labelY + ' →', 0, 0); ctx.restore();

  CHARACTERS.forEach(c => {
    const rx = m + pw * (c[axisX] + 1) / 2;
    const ry = m + ph * (1 - (c[axisY] + 1) / 2);
    const px = m + pw * (state.perceived[c.id][axisX] + 1) / 2;
    const py = m + ph * (1 - (state.perceived[c.id][axisY] + 1) / 2);

    ctx.beginPath(); ctx.arc(rx, ry, 5, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(120,140,170,0.5)'; ctx.fill();

    ctx.beginPath(); ctx.moveTo(rx, ry); ctx.lineTo(px, py);
    ctx.strokeStyle = 'rgba(126,200,227,0.3)'; ctx.setLineDash([3, 3]); ctx.stroke();
    ctx.setLineDash([]);

    ctx.beginPath(); ctx.arc(px, py, 5, 0, Math.PI * 2);
    ctx.fillStyle = '#5c9fd4'; ctx.fill();
    ctx.fillStyle = '#ccc'; ctx.font = '9px Microsoft YaHei';
    ctx.fillText(c.name.slice(0, 3), px, py - 9);
  });
}

function exportData() {
  const data = {
    player: PLAYER,
    timestamp: new Date().toISOString(),
    choiceLog: state.choiceLog,
    perceivedPositions: state.perceived,
    characterTruth: CHARACTERS.map(c => ({
      id: c.id, name: c.name,
      distrib: c.distrib, proced: c.proced, interact: c.interact
    })),
    evaluations: CHARACTERS.map(c => ({
      id: c.id, name: c.name, text: state.evaluations[c.id]
    })),
    overallEvaluation: state.overallEval
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'fairness_roleplay_' + Date.now() + '.json';
  a.click();
}

initState();
render();
</script>
